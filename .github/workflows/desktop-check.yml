name: Desktop checks

on:
  push:
    branches: [desktop-app-foundation]
  pull_request:
    branches: [main]

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop package
        run: python -m pip install -e ./desktop
      - name: Compile Python modules
        run: python -m compileall -q desktop
      - name: Run bridge unit tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Verify desktop imports
        run: python -c "from desktop.app import DesktopWindow; from desktop.engine_runner import serialize_order; print('Desktop imports OK')"
      - name: Smoke-test desktop window construction
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from desktop.app import DesktopWindow; app = QApplication([]); window = DesktopWindow(); assert window.pages.count() == len(window.PAGES); print('Desktop window smoke test OK'); window.close()"
