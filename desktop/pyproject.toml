[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-assistant-desktop"
version = "0.1.0"
description = "Desktop interface for FunPay Vertex"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "psutil>=5.9.4",
    "beautifulsoup4>=4.11.1",
    "colorama>=0.4.6",
    "requests==2.28.1",
    "pytelegrambotapi==4.15.2",
    "pillow>=9.3.0",
    "requests_toolbelt==0.10.1",
    "lxml>=5.3.0",
    "bcrypt>=4.2.0",
    "pysocks>=1.7.1",
]

[project.scripts]
funpay-assistant = "desktop.app:main"

[tool.setuptools]
packages = ["desktop"]
package-dir = {desktop = "."}
